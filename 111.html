<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代理节点格式互换</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e13;
    --bg-dot: rgba(255,255,255,0.028);
    --panel:#121821;
    --panel-alt:#0d1219;
    --border:#232d3a;
    --border-soft:#1a222c;
    --text:#e6edf5;
    --muted:#8695a7;
    --muted-2:#59687a;
    --accent:#4fa8ff;
    --accent-soft:rgba(79,168,255,0.14);
    --ok:#43d19e;
    --ok-soft:rgba(67,209,158,0.14);
    --warn:#f2b53d;
    --warn-soft:rgba(242,181,61,0.14);
    --bad:#ff6a6d;
    --bad-soft:rgba(255,106,109,0.14);
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  ::selection{ background:var(--accent-soft); color:var(--text); }
  html{ background:var(--bg); }
  body{
    margin:0;
    padding:32px 18px 70px;
    background:
      radial-gradient(circle at 1px 1px, var(--bg-dot) 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .shell{ max-width:640px; margin:0 auto; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  /* ---- header ---- */
  header{ margin-bottom:22px; }
  .status-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--ok); margin-right:8px; vertical-align:1px;
    box-shadow:0 0 0 3px var(--ok-soft);
  }
  h1{ font-size:20px; font-weight:600; margin:0 0 6px; letter-spacing:-0.01em; }
  p.sub{ color:var(--muted); font-size:13px; margin:0 0 16px; max-width:52ch; }

  .protocols{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:24px; }
  .proto-chip{
    font-family:var(--mono); font-size:11px; color:var(--muted-2);
    border:1px solid var(--border-soft); border-radius:999px;
    padding:4px 10px; transition:color .15s, border-color .15s, background .15s;
  }
  .proto-chip.present{
    color:var(--accent); border-color:rgba(79,168,255,0.35); background:var(--accent-soft);
  }

  /* ---- pipeline ---- */
  .pipeline{ display:flex; align-items:center; margin-bottom:26px; }
  .pipe-step{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:none; width:64px; }
  .pipe-dot{
    width:9px; height:9px; border-radius:50%; background:var(--panel);
    border:1.5px solid var(--border); transition:background .2s, border-color .2s, box-shadow .2s;
  }
  .pipe-step.done .pipe-dot{ background:var(--accent); border-color:var(--accent); }
  .pipe-step.current .pipe-dot{ animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 var(--accent-soft); }
    50%{ box-shadow:0 0 0 5px var(--accent-soft); }
  }
  .pipe-label{ font-size:11px; color:var(--muted-2); }
  .pipe-step.done .pipe-label{ color:var(--muted); }
  .pipe-line{ flex:1; height:1px; background:var(--border); margin:0 -2px 17px; }
  @media (prefers-reduced-motion: reduce){ .pipe-step.current .pipe-dot{ animation:none; } }

  /* ---- generic ---- */
  .section{ margin-bottom:22px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .section-title{ font-size:13px; color:var(--muted); }
  .section-hint{ font-size:11px; color:var(--muted-2); }

  /* ---- io card (input / output) ---- */
  .io-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden;
  }
  .io-bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 12px; background:var(--panel-alt); border-bottom:1px solid var(--border-soft);
  }
  .io-label{ font-family:var(--mono); font-size:11px; color:var(--muted); }
  .io-badge{
    font-family:var(--mono); font-size:11px; color:var(--accent);
    background:var(--accent-soft); border:1px solid rgba(79,168,255,0.3);
    border-radius:5px; padding:2px 8px;
  }
  textarea{
    display:block; width:100%;
    background:transparent; border:0; outline:none;
    color:var(--text); font-family:var(--mono); font-size:12.5px;
    padding:12px; resize:vertical;
  }
  #input{height:126px;}
  #output{height:210px;}

  #err{
    color:var(--bad); font-size:12.5px; margin-top:8px; padding:8px 10px;
    border-left:2px solid var(--bad); background:var(--bad-soft); border-radius:0 6px 6px 0;
    display:none; white-space:pre-wrap;
  }

  /* ---- tabs (output format) ---- */
  .io-tabs{ display:flex; gap:2px; flex-wrap:wrap; }
  .io-tabs button{
    background:transparent; color:var(--muted); border:1px solid transparent; border-radius:6px;
    padding:5px 9px; font-family:var(--sans); font-size:12px; font-weight:500; cursor:pointer;
    transition:background .15s, color .15s;
  }
  .io-tabs button:hover{ color:var(--text); }
  .io-tabs button.active{ background:var(--accent-soft); color:var(--accent); }
  .io-copy{
    background:var(--accent); color:#04121f; border:none; border-radius:6px;
    padding:6px 13px; font-family:var(--sans); font-size:12px; font-weight:600; cursor:pointer;
    flex:none; transition:filter .15s;
  }
  .io-copy:hover{ filter:brightness(1.08); }

  .meta{ font-size:11.5px; color:var(--muted-2); font-family:var(--mono); margin-top:8px; white-space:pre-wrap; }

  /* ---- toolbar buttons above node list ---- */
  .toolbar{ display:flex; gap:6px; flex-wrap:wrap; }
  .toolbar button{
    background:var(--panel); color:var(--muted); border:1px solid var(--border); border-radius:6px;
    padding:6px 10px; font-family:var(--sans); font-size:12px; font-weight:500; cursor:pointer;
    transition:color .15s, border-color .15s;
  }
  .toolbar button:hover{ color:var(--text); border-color:var(--muted-2); }

  /* ---- stat chips ---- */
  .stats{ display:flex; gap:6px; flex-wrap:wrap; }
  .stat-chip{
    display:flex; align-items:baseline; gap:4px;
    border:1px solid var(--border-soft); border-radius:6px; padding:4px 8px;
    background:var(--panel);
  }
  .stat-num{ font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--text); }
  .stat-label{ font-size:10.5px; color:var(--muted-2); }
  .stat-chip.tone-ok .stat-num{ color:var(--ok); }
  .stat-chip.tone-warn .stat-num{ color:var(--warn); }
  .stat-chip.tone-bad .stat-num{ color:var(--bad); }
  .stat-chip.tone-accent .stat-num{ color:var(--accent); }

  /* ---- node list ---- */
  #nodelist{
    border:1px solid var(--border); border-radius:var(--radius); background:var(--panel);
    max-height:260px; overflow-y:auto;
  }
  #nodelist .empty{ padding:20px; color:var(--muted-2); font-size:12.5px; text-align:center; }
  .node-row{
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 12px 10px 10px;
    border-bottom:1px solid var(--border-soft);
    border-left:2px solid var(--accent);
  }
  .node-row:last-child{ border-bottom:none; }
  .node-row.dup{ border-left-color:var(--warn); }
  .node-row.invalid{ border-left-color:var(--bad); opacity:0.6; }
  .node-row input[type=checkbox]{ margin-top:3px; accent-color:var(--accent); width:15px; height:15px; flex:none; }
  .node-main{ min-width:0; flex:1; }
  .node-title{ font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-family:var(--mono); }
  .node-title .tag{
    font-family:var(--sans); font-size:10px; font-weight:700; padding:1px 6px; border-radius:4px;
    background:var(--accent-soft); color:var(--accent);
  }
  .node-title .tag.dup{ background:var(--warn-soft); color:var(--warn); }
  .node-title .tag.bad{ background:var(--bad-soft); color:var(--bad); }
  .node-sub{ font-size:11px; color:var(--muted-2); font-family:var(--mono); margin-top:3px; word-break:break-all; }
  .node-warn{ font-size:11px; color:var(--warn); margin-top:3px; }
  .node-err{ font-size:11px; color:var(--bad); margin-top:3px; }
</style>
</head>
<body>
<div class="shell">

<header>
  <h1><span class="status-dot"></span>代理节点格式互换</h1>
  <p class="sub">分享链接、YAML、JSON、Base64 订阅之间互相转换。粘贴内容后自动识别格式,支持多节点与多协议混合。</p>
  <div class="protocols" id="protocols">
    <span class="proto-chip" data-scheme="vless">VLESS</span>
    <span class="proto-chip" data-scheme="vmess">VMess</span>
    <span class="proto-chip" data-scheme="trojan">Trojan</span>
    <span class="proto-chip" data-scheme="ss">Shadowsocks</span>
    <span class="proto-chip" data-scheme="ssr">ShadowsocksR</span>
    <span class="proto-chip" data-scheme="hysteria2">Hysteria2</span>
    <span class="proto-chip" data-scheme="tuic">TUIC</span>
  </div>
  <div class="pipeline" aria-hidden="true">
    <div class="pipe-step" id="pipe-1"><span class="pipe-dot"></span><span class="pipe-label">粘贴</span></div>
    <div class="pipe-line"></div>
    <div class="pipe-step" id="pipe-2"><span class="pipe-dot"></span><span class="pipe-label">识别</span></div>
    <div class="pipe-line"></div>
    <div class="pipe-step" id="pipe-3"><span class="pipe-dot"></span><span class="pipe-label">筛选</span></div>
    <div class="pipe-line"></div>
    <div class="pipe-step" id="pipe-4"><span class="pipe-dot"></span><span class="pipe-label">导出</span></div>
  </div>
</header>

<div class="section">
  <div class="section-head">
    <label class="section-title" for="input">输入</label>
    <span class="section-hint">支持多行多节点、多协议混合粘贴</span>
  </div>
  <div class="io-card">
    <div class="io-bar">
      <span class="io-label">paste-here</span>
      <span class="io-badge" id="detected" style="display:none;"></span>
    </div>
    <textarea id="input" placeholder="vless:// / vmess:// / trojan:// / ss:// / hysteria2:// 链接,或 YAML / JSON / base64 订阅"></textarea>
  </div>
  <div id="err"></div>
</div>

<div class="section">
  <div class="section-head">
    <label class="section-title">节点列表</label>
    <span class="section-hint">取消勾选可从输出中剔除;单条解析失败不影响其余节点</span>
  </div>
  <div class="section-head">
    <div class="stats" id="counts"></div>
    <div class="toolbar">
      <button onclick="selectAll(true)">全选</button>
      <button onclick="selectAll(false)">全不选</button>
      <button onclick="applyDedupe()">去重</button>
      <button onclick="applyValidOnly()">仅保留有效</button>
    </div>
  </div>
  <div id="nodelist"><div class="empty">粘贴节点内容后将在此显示</div></div>
</div>

<div class="section">
  <div class="section-head">
    <label class="section-title" for="output">输出结果</label>
    <span class="section-hint">仅包含已勾选的有效节点</span>
  </div>
  <div class="io-card">
    <div class="io-bar">
      <div class="io-tabs" id="fmtrow">
        <button data-fmt="block" class="active">YAML 多行</button>
        <button data-fmt="flow">YAML 单行</button>
        <button data-fmt="uri">分享链接</button>
        <button data-fmt="json">JSON</button>
        <button data-fmt="base64">Base64</button>
      </div>
      <button class="io-copy" id="copyBtn" onclick="copyOut()">复制结果</button>
    </div>
    <textarea id="output" readonly></textarea>
  </div>
  <div class="meta" id="meta"></div>
</div>

</div>
<script>
let outFmt = 'block';
const SCHEMES = ['vless','vmess','trojan','ssr','ss','hysteria2','hy2','tuic'];
let currentItems = []; // {raw, obj, error, warning, isDupe, checked}
let lastWarning = null; // set by individual parsers, read once per item

document.querySelectorAll('#fmtrow button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#fmtrow button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    outFmt = btn.dataset.fmt;
    regenerateOutput();
  });
});

// ---------- base64 helpers (unicode safe) ----------
function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decode(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/').replace(/\s+/g,'');
  while(str.length % 4) str += '=';
  return decodeURIComponent(escape(atob(str)));
}
function safeB64decodeRaw(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/').replace(/\s+/g,'');
  while(str.length % 4) str += '=';
  return atob(str);
}
function b64encodeUrlSafe(str){
  return b64encode(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function parseQuery(queryStr){
  const params = {};
  queryStr.split('&').forEach(kv=>{
    if(!kv) return;
    const [k,v=''] = kv.split('=');
    params[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g,' '));
  });
  return params;
}

function splitUri(uri, schemeLen){
  const rest = uri.slice(schemeLen);
  const hashIdx = rest.indexOf('#');
  const name = hashIdx >= 0 ? decodeURIComponent(rest.slice(hashIdx+1)) : '';
  const withoutName = hashIdx >= 0 ? rest.slice(0, hashIdx) : rest;
  const qIdx = withoutName.indexOf('?');
  const authPart = qIdx >= 0 ? withoutName.slice(0, qIdx) : withoutName;
  const queryStr = qIdx >= 0 ? withoutName.slice(qIdx+1) : '';
  return { authPart, params: parseQuery(queryStr), name };
}

function splitHostPort(hostport){
  // supports IPv6 in [::1]:443 form
  if(hostport.startsWith('[')){
    const end = hostport.indexOf(']');
    return { server: hostport.slice(1,end), port: parseInt(hostport.slice(end+2),10) };
  }
  const colonIdx = hostport.lastIndexOf(':');
  return { server: hostport.slice(0,colonIdx), port: parseInt(hostport.slice(colonIdx+1),10) };
}

// ---------- VLESS ----------
function parseVless(uri){
  const { authPart, params, name } = splitUri(uri, 'vless://'.length);
  const atIdx = authPart.lastIndexOf('@');
  if(atIdx < 0) throw new Error('vless 缺少 uuid@host 部分');
  const uuid = authPart.slice(0, atIdx);
  const { server, port } = splitHostPort(authPart.slice(atIdx+1));

  const network = params.type || 'tcp';
  const security = params.security || 'none';
  const tls = (security === 'tls' || security === 'reality');
  const sni = params.sni || params.host || server;
  const insecure = (params.insecure === '1' || params.allowInsecure === '1');

  const obj = { name: name || 'VLESS', server, port, type: 'vless', uuid, network, udp: true, tls };
  if(tls){ obj.servername = sni; obj['skip-cert-verify'] = insecure; }
  if(params.fp) obj['client-fingerprint'] = params.fp;
  if(params.flow) obj.flow = params.flow;
  if(security === 'reality'){
    obj['reality-opts'] = {};
    if(params.pbk) obj['reality-opts']['public-key'] = params.pbk;
    if(params.sid) obj['reality-opts']['short-id'] = params.sid;
  }
  attachTransportOpts(obj, network, params, sni);
  return obj;
}
function buildVless(p){
  const params = ['encryption=none'];
  const isReality = !!p['reality-opts'];
  const security = p.tls ? (isReality ? 'reality' : 'tls') : 'none';
  params.push('security=' + security);
  const network = p.network || 'tcp';
  params.push('type=' + network);
  if(p.tls){
    if(p.servername) params.push('sni=' + encodeURIComponent(p.servername));
    const insecure = p['skip-cert-verify'] ? '1' : '0';
    params.push('insecure=' + insecure, 'allowInsecure=' + insecure);
  }
  if(p['client-fingerprint']) params.push('fp=' + encodeURIComponent(p['client-fingerprint']));
  if(p.flow) params.push('flow=' + encodeURIComponent(p.flow));
  if(isReality){
    if(p['reality-opts']['public-key']) params.push('pbk=' + encodeURIComponent(p['reality-opts']['public-key']));
    if(p['reality-opts']['short-id']) params.push('sid=' + encodeURIComponent(p['reality-opts']['short-id']));
  }
  appendTransportParams(params, network, p);
  return `vless://${p.uuid}@${p.server}:${p.port}?${params.join('&')}#${encodeURIComponent(p.name||'VLESS')}`;
}

// ---------- VMESS ----------
function parseVmess(uri){
  const b64 = uri.slice('vmess://'.length).trim();
  let json;
  try{ json = JSON.parse(b64decode(b64)); }
  catch(e){ throw new Error('vmess base64/JSON 解析失败'); }
  const network = json.net || 'tcp';
  const tls = (json.tls === 'tls' || json.tls === true);
  const sni = json.sni || json.host || json.add;
  const obj = {
    name: json.ps || 'VMess', server: json.add, port: parseInt(json.port,10),
    type: 'vmess', uuid: json.id, alterId: parseInt(json.aid||0,10), cipher: 'auto',
    network, udp: true, tls
  };
  // preserve header/obfs type (e.g. tcp+http) so it isn't silently dropped on re-export
  if(json.type && json.type !== 'none') obj.headerType = json.type;
  if(tls){ obj.servername = sni; obj['skip-cert-verify'] = false; }
  if(json.fp) obj['client-fingerprint'] = json.fp;
  const fakeParams = { path: json.path, host: json.host, serviceName: json.path };
  attachTransportOpts(obj, network, fakeParams, sni);
  return obj;
}
function buildVmess(p){
  const json = {
    v: '2', ps: p.name || 'VMess', add: p.server, port: String(p.port),
    id: p.uuid, aid: String(p.alterId || 0), scy: p.cipher || 'auto',
    net: p.network || 'tcp', type: p.headerType || 'none',
    host: (p['ws-opts'] && p['ws-opts'].headers && p['ws-opts'].headers.Host) || '',
    path: (p['ws-opts'] && p['ws-opts'].path) || (p['grpc-opts'] && p['grpc-opts']['grpc-service-name']) || '',
    tls: p.tls ? 'tls' : '', sni: p.servername || ''
  };
  if(p['client-fingerprint']) json.fp = p['client-fingerprint'];
  return 'vmess://' + b64encode(JSON.stringify(json));
}

// ---------- TROJAN ----------
function parseTrojanFixed(uri){
  const { authPart, params, name } = splitUri(uri, 'trojan://'.length);
  const atIdx = authPart.lastIndexOf('@');
  if(atIdx < 0) throw new Error('trojan 缺少 password@host 部分');
  const password = decodeURIComponent(authPart.slice(0, atIdx));
  const { server, port } = splitHostPort(authPart.slice(atIdx+1));
  const network = params.type || 'tcp';
  const sni = params.sni || params.peer || server;
  const insecure = (params.allowInsecure === '1' || params.insecure === '1');
  const obj = { name: name || 'Trojan', server, port, type: 'trojan', password, network, udp: true, sni, 'skip-cert-verify': insecure };
  if(params.fp) obj['client-fingerprint'] = params.fp;
  attachTransportOpts(obj, network, params, sni);
  return obj;
}
function buildTrojan(p){
  const params = [];
  const network = p.network || 'tcp';
  if(network !== 'tcp') params.push('type=' + network);
  if(p.sni) params.push('sni=' + encodeURIComponent(p.sni));
  params.push('allowInsecure=' + (p['skip-cert-verify'] ? '1' : '0'));
  if(p['client-fingerprint']) params.push('fp=' + encodeURIComponent(p['client-fingerprint']));
  appendTransportParams(params, network, p);
  const q = params.length ? '?' + params.join('&') : '';
  return `trojan://${encodeURIComponent(p.password)}@${p.server}:${p.port}${q}#${encodeURIComponent(p.name||'Trojan')}`;
}

// ---------- SHADOWSOCKS ----------
function parseSS(uri){
  let body = uri.slice('ss://'.length);
  const hashIdx = body.indexOf('#');
  const name = hashIdx >= 0 ? decodeURIComponent(body.slice(hashIdx+1)) : 'SS';
  body = hashIdx >= 0 ? body.slice(0, hashIdx) : body;
  const slashIdx = body.indexOf('/');
  if(slashIdx >= 0){
    // SIP002 plugin query, e.g. /?plugin=obfs-local%3Bobfs%3Dhttp
    const query = body.slice(slashIdx+1);
    body = body.slice(0, slashIdx);
    const m = query.match(/(?:^|[?&])plugin=([^&]+)/);
    if(m) lastWarning = '检测到 plugin 参数 (' + decodeURIComponent(m[1]) + '),该转换器不支持插件,已忽略,请手动补充';
  }
  const atIdx = body.lastIndexOf('@');
  let method, password, server, port;
  if(atIdx >= 0){
    // SIP002: base64(method:password)@server:port
    let userinfo = body.slice(0, atIdx);
    const hostpart = body.slice(atIdx+1);
    let decoded;
    try{ decoded = safeB64decodeRaw(userinfo); }
    catch(e){ decoded = userinfo; } // maybe already plain method:password
    if(!decoded.includes(':')) decoded = userinfo;
    [method, password] = splitFirst(decoded, ':');
    ({ server, port } = splitHostPort(hostpart));
  } else {
    // legacy: base64(method:password@server:port)
    const decoded = safeB64decodeRaw(body);
    const at2 = decoded.lastIndexOf('@');
    const userinfo = decoded.slice(0, at2);
    const hostpart = decoded.slice(at2+1);
    [method, password] = splitFirst(userinfo, ':');
    ({ server, port } = splitHostPort(hostpart));
  }
  return { name, server, port, type: 'ss', cipher: method, password, udp: true };
}
function splitFirst(str, sep){
  const idx = str.indexOf(sep);
  return idx < 0 ? [str, ''] : [str.slice(0,idx), str.slice(idx+1)];
}
function buildSS(p){
  const userinfo = b64encode(`${p.cipher}:${p.password}`).replace(/=+$/,'');
  return `ss://${userinfo}@${p.server}:${p.port}#${encodeURIComponent(p.name||'SS')}`;
}

// ---------- HYSTERIA2 ----------
function parseHysteria2(uri, schemeLen){
  const { authPart, params, name } = splitUri(uri, schemeLen);
  const atIdx = authPart.lastIndexOf('@');
  const password = atIdx >= 0 ? decodeURIComponent(authPart.slice(0, atIdx)) : '';
  const { server, port } = splitHostPort(atIdx >= 0 ? authPart.slice(atIdx+1) : authPart);
  const sni = params.sni || params.peer || server;
  const insecure = (params.insecure === '1');
  const obj = { name: name || 'Hysteria2', server, port, type: 'hysteria2', password, sni, 'skip-cert-verify': insecure };
  if(params.obfs) obj.obfs = params.obfs;
  if(params['obfs-password']) obj['obfs-password'] = params['obfs-password'];
  return obj;
}
function buildHysteria2(p){
  const params = [];
  if(p.sni) params.push('sni=' + encodeURIComponent(p.sni));
  params.push('insecure=' + (p['skip-cert-verify'] ? '1' : '0'));
  if(p.obfs) params.push('obfs=' + encodeURIComponent(p.obfs));
  if(p['obfs-password']) params.push('obfs-password=' + encodeURIComponent(p['obfs-password']));
  const q = params.length ? '?' + params.join('&') : '';
  return `hysteria2://${encodeURIComponent(p.password)}@${p.server}:${p.port}${q}#${encodeURIComponent(p.name||'Hysteria2')}`;
}

// ---------- TUIC ----------
function parseTuic(uri, schemeLen){
  const { authPart, params, name } = splitUri(uri, schemeLen);
  const atIdx = authPart.lastIndexOf('@');
  if(atIdx < 0) throw new Error('tuic 缺少 uuid:password@host 部分');
  const userinfo = authPart.slice(0, atIdx);
  const colonIdx = userinfo.indexOf(':');
  const uuid = colonIdx < 0 ? userinfo : userinfo.slice(0, colonIdx);
  const password = colonIdx < 0 ? '' : decodeURIComponent(userinfo.slice(colonIdx+1));
  const { server, port } = splitHostPort(authPart.slice(atIdx+1));
  const sni = params.sni || server;
  const obj = {
    name: name || 'TUIC', server, port, type: 'tuic', uuid, password,
    sni, 'skip-cert-verify': (params.allow_insecure === '1' || params.insecure === '1'),
    alpn: params.alpn ? params.alpn.split(',') : ['h3'],
    'congestion-controller': params.congestion_control || params.cc || 'bbr',
    'udp-relay-mode': params.udp_relay_mode || 'native'
  };
  if(params.disable_sni) obj['disable-sni'] = params.disable_sni === '1';
  return obj;
}
function buildTuic(p){
  const params = [];
  if(p.sni) params.push('sni=' + encodeURIComponent(p.sni));
  params.push('allow_insecure=' + (p['skip-cert-verify'] ? '1' : '0'));
  if(p.alpn) params.push('alpn=' + encodeURIComponent((Array.isArray(p.alpn)?p.alpn.join(','):p.alpn)));
  if(p['congestion-controller']) params.push('congestion_control=' + encodeURIComponent(p['congestion-controller']));
  if(p['udp-relay-mode']) params.push('udp_relay_mode=' + encodeURIComponent(p['udp-relay-mode']));
  const q = params.length ? '?' + params.join('&') : '';
  return `tuic://${p.uuid}:${encodeURIComponent(p.password||'')}@${p.server}:${p.port}${q}#${encodeURIComponent(p.name||'TUIC')}`;
}

// ---------- SHADOWSOCKSR (SSR) ----------
function parseSSR(uri){
  const body = uri.slice('ssr://'.length).trim();
  const decoded = b64decode(body);
  const qIdx = decoded.indexOf('/?');
  const mainPart = qIdx >= 0 ? decoded.slice(0, qIdx) : decoded;
  const queryPart = qIdx >= 0 ? decoded.slice(qIdx+2) : '';

  const segs = mainPart.split(':');
  if(segs.length < 6) throw new Error('ssr 主体格式不正确');
  // take the last 5 fields as port/protocol/method/obfs/password, everything before
  // that is the server address - this keeps IPv6 addresses (which contain colons) intact
  const tail = segs.slice(-5);
  const server = segs.slice(0, -5).join(':');
  const [port, protocol, method, obfs, passwordB64] = tail;
  const password = b64decode(passwordB64);

  const rawParams = {};
  queryPart.split('&').forEach(kv=>{
    if(!kv) return;
    const [k, v=''] = kv.split('=');
    rawParams[k] = v;
  });
  const obfsparam = rawParams.obfsparam ? b64decode(rawParams.obfsparam) : '';
  const protoparam = rawParams.protoparam ? b64decode(rawParams.protoparam) : '';
  const remarks = rawParams.remarks ? b64decode(rawParams.remarks) : 'SSR';

  return {
    name: remarks, server, port: parseInt(port,10), type: 'ssr',
    cipher: method, password, protocol, obfs,
    'protocol-param': protoparam, 'obfs-param': obfsparam, udp: true
  };
}
function buildSSR(p){
  const passwordB64 = b64encodeUrlSafe(p.password || '');
  const main = [p.server, p.port, p.protocol || 'origin', p.cipher, p.obfs || 'plain', passwordB64].join(':');
  const qparams = [];
  if(p['obfs-param']) qparams.push('obfsparam=' + b64encodeUrlSafe(p['obfs-param']));
  if(p['protocol-param']) qparams.push('protoparam=' + b64encodeUrlSafe(p['protocol-param']));
  qparams.push('remarks=' + b64encodeUrlSafe(p.name || 'SSR'));
  const full = main + '/?' + qparams.join('&');
  return 'ssr://' + b64encodeUrlSafe(full);
}


function attachTransportOpts(obj, network, params, sni){
  if(network === 'ws'){
    obj['ws-opts'] = { path: params.path || '/', headers: { Host: params.host || sni } };
  } else if(network === 'grpc'){
    obj['grpc-opts'] = { 'grpc-service-name': params.serviceName || params.path || '' };
  } else if(network === 'h2'){
    obj['h2-opts'] = { path: params.path || '/', host: [params.host || sni] };
  }
}
function appendTransportParams(params, network, p){
  if(network === 'ws' && p['ws-opts']){
    params.push('path=' + encodeURIComponent(p['ws-opts'].path || '/'));
    const h = p['ws-opts'].headers && p['ws-opts'].headers.Host;
    if(h) params.push('host=' + encodeURIComponent(h));
  } else if(network === 'grpc' && p['grpc-opts']){
    params.push('serviceName=' + encodeURIComponent(p['grpc-opts']['grpc-service-name'] || ''));
  } else if(network === 'h2' && p['h2-opts']){
    params.push('path=' + encodeURIComponent(p['h2-opts'].path || '/'));
    const h = (p['h2-opts'].host || [])[0];
    if(h) params.push('host=' + encodeURIComponent(h));
  }
}

// ---------- dispatchers ----------
const PARSERS = {
  vless: uri => parseVless(uri),
  vmess: uri => parseVmess(uri),
  trojan: uri => parseTrojanFixed(uri),
  ssr: uri => parseSSR(uri),
  ss: uri => parseSS(uri),
  hysteria2: uri => parseHysteria2(uri, 'hysteria2://'.length),
  hy2: uri => parseHysteria2(uri, 'hy2://'.length),
  tuic: uri => parseTuic(uri, 'tuic://'.length)
};
const BUILDERS = {
  vless: buildVless, vmess: buildVmess, trojan: buildTrojan,
  ss: buildSS, ssr: buildSSR, hysteria2: buildHysteria2, tuic: buildTuic
};
function uriToObj(uri){
  uri = uri.trim();
  lastWarning = null;
  for(const scheme of SCHEMES){
    if(uri.startsWith(scheme + '://')) return PARSERS[scheme](uri);
  }
  throw new Error('不支持的协议: ' + uri.slice(0, 15));
}
function objToUri(p){
  const fn = BUILDERS[p.type];
  if(!fn) throw new Error('不支持转换为链接的类型: ' + p.type);
  return fn(p);
}

// ---------- validation & dedupe ----------
function validateObj(obj){
  if(!obj || typeof obj !== 'object') return '不是有效的节点对象';
  if(!obj.server) return '缺少 server';
  if(!obj.port || isNaN(obj.port)) return '缺少或无效的 port';
  if(!obj.type) return '缺少 type';
  switch(obj.type){
    case 'vless': case 'vmess':
      if(!obj.uuid) return '缺少 uuid'; break;
    case 'trojan': case 'hysteria2':
      if(!obj.password) return '缺少 password'; break;
    case 'ss': case 'ssr':
      if(!obj.cipher || !obj.password) return '缺少 cipher/password'; break;
    case 'tuic':
      if(!obj.uuid && !obj.password) return '缺少 uuid/password'; break;
  }
  return null;
}
function dedupeKey(obj){
  const id = obj.uuid || obj.password || '';
  return [obj.type, obj.server, obj.port, id].join('|');
}

// ---------- split raw uri text into individual links ----------
function splitUriList(text){
  const schemeStartRe = new RegExp('^(?:' + SCHEMES.join('|') + '):\\/\\/');
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const result = [];
  lines.forEach(line=>{
    const multiSchemeRe = new RegExp('(?:' + SCHEMES.join('|') + '):\\/\\/', 'g');
    const hits = line.match(multiSchemeRe);
    if(hits && hits.length > 1){
      // multiple links concatenated on one line - split with lookahead
      const pattern = new RegExp('(?:' + SCHEMES.join('|') + '):\\/\\/[\\s\\S]*?(?=(?:' + SCHEMES.join('|') + '):\\/\\/|$)', 'g');
      (line.match(pattern) || []).forEach(p => { if(p.trim()) result.push(p.trim()); });
    } else if(schemeStartRe.test(line)){
      result.push(line);
    }
  });
  return result;
}

// ---------- YAML text -> proxy object list ----------
function yamlToObjs(text){
  // strip a common leading indentation across all non-empty lines first, so that
  // re-wrapping under a synthetic "proxies:" key doesn't produce inconsistent
  // sequence-item indentation (which js-yaml rejects). Previously only the very
  // first line got outdented by String.trim(), while later lines kept their
  // original indent - that mismatch is what caused "解析失败" on pasted YAML
  // where every line starts with a couple of leading spaces.
  const rawLines = text.replace(/\r\n/g, '\n').split('\n');
  const nonEmpty = rawLines.filter(l => l.trim() !== '');
  if(nonEmpty.length === 0) throw new Error('无法识别的 YAML 结构');
  let minIndent = Infinity;
  nonEmpty.forEach(l => { minIndent = Math.min(minIndent, l.match(/^ */)[0].length); });
  const dedented = nonEmpty.map(l => l.slice(minIndent).replace(/\s+$/, ''));

  let t = dedented.join('\n');
  if(!t.startsWith('proxies:')){
    if(t.startsWith('-')){
      // re-indent every sequence item consistently under the synthetic key
      t = 'proxies:\n' + dedented.map(l => '  ' + l).join('\n');
    } else if(t.startsWith('{')){
      t = 'proxies:\n  - ' + t;
    } else {
      throw new Error('无法识别的 YAML 结构');
    }
  }
  const doc = jsyaml.load(t);
  if(!doc || !doc.proxies || !Array.isArray(doc.proxies)) throw new Error('未找到 proxies 列表');
  return doc.proxies;
}

// ---------- JSON text -> proxy object list ----------
function jsonToObjs(text){
  const doc = JSON.parse(text);
  if(Array.isArray(doc)) return doc;
  if(doc && Array.isArray(doc.proxies)) return doc.proxies;
  if(doc && typeof doc === 'object') return [doc];
  throw new Error('JSON 结构不含节点信息');
}

// ---------- serializers ----------
function objsToYamlBlock(objs){ return jsyaml.dump({ proxies: objs }, { lineWidth: -1 }); }
function objsToYamlFlow(objs){
  const lines = objs.map(p => '  - ' + jsyaml.dump(p, { flowLevel: 0, lineWidth: -1 }).trim());
  return 'proxies:\n' + lines.join('\n');
}
function objsToJson(objs){ return JSON.stringify({ proxies: objs }, null, 2); }
function objsToBase64(objs){
  const lines = [];
  objs.forEach(p=>{ try{ lines.push(objToUri(p)); }catch(e){ /* skip unsupported type */ } });
  return b64encode(lines.join('\n'));
}

// ---------- detect format ----------
function detectFormat(text){
  const t = text.trim();
  if(!t) return 'empty';
  const schemeRe = new RegExp('^(?:' + SCHEMES.join('|') + '):\\/\\/');
  if(schemeRe.test(t)) return 'uri';
  if(t.startsWith('{') || t.startsWith('[')){
    try{ JSON.parse(t); return 'json'; }catch(e){}
  }
  if(t.startsWith('-') || t.startsWith('proxies:')) return 'yaml';
  if(/^[A-Za-z0-9+/=_\s-]+$/.test(t) && t.length > 20 && t.length < 2000000){
    try{
      const decoded = b64decode(t.replace(/\s+/g,''));
      if(SCHEMES.some(s => decoded.includes(s + '://'))) return 'base64';
    }catch(e){}
  }
  return 'unknown';
}

const fmtLabel = { uri:'分享链接', yaml:'YAML', json:'JSON', base64:'Base64 订阅', unknown:'未知', empty:'' };

// ---------- build per-item results (never lets one bad node kill the rest) ----------
function buildItemsFromUriTexts(uris){
  return uris.map(raw=>{
    try{
      const obj = uriToObj(raw);
      const verr = validateObj(obj);
      return { raw, obj: verr ? null : obj, error: verr, warning: lastWarning };
    }catch(e){
      return { raw, obj: null, error: e.message, warning: null };
    }
  });
}
function buildItemsFromObjs(objs){
  return objs.map(obj=>{
    const verr = validateObj(obj);
    let raw;
    try{ raw = objToUri(obj); }
    catch(e){ raw = (obj && obj.name ? obj.name + ' ' : '') + JSON.stringify(obj); }
    return { raw, obj: verr ? null : obj, error: verr, warning: null };
  });
}

function parseInputToItems(text, fmt){
  if(fmt === 'uri'){
    const uris = splitUriList(text);
    if(uris.length === 0) throw new Error('未找到可识别的节点链接');
    return buildItemsFromUriTexts(uris);
  }
  if(fmt === 'base64'){
    const decoded = b64decode(text.trim());
    const uris = splitUriList(decoded);
    if(uris.length === 0) throw new Error('base64 内容中未找到可识别的节点链接');
    return buildItemsFromUriTexts(uris);
  }
  if(fmt === 'yaml') return buildItemsFromObjs(yamlToObjs(text));
  if(fmt === 'json') return buildItemsFromObjs(jsonToObjs(text));
  throw new Error('无法识别输入格式,请粘贴分享链接、YAML、JSON 或 base64 订阅内容');
}

function markDuplicates(items){
  const seen = new Set();
  items.forEach(item=>{
    if(!item.obj){ item.isDupe = false; return; }
    const key = dedupeKey(item.obj);
    if(seen.has(key)){ item.isDupe = true; }
    else { item.isDupe = false; seen.add(key); }
  });
}

// ---------- main input handler ----------
function handleInput(){
  const errBox = document.getElementById('err');
  const detected = document.getElementById('detected');
  errBox.style.display = 'none';
  const input = document.getElementById('input').value;

  if(!input.trim()){
    currentItems = [];
    detected.textContent = '';
    renderList();
    regenerateOutput();
    return;
  }

  const fmt = detectFormat(input);
  detected.innerHTML = fmt === 'empty' ? '' : ('识别输入格式: <b>' + (fmtLabel[fmt] || '未知') + '</b>');

  try{
    const items = parseInputToItems(input, fmt);
    markDuplicates(items);
    items.forEach(item => { item.checked = !!item.obj && !item.isDupe; });
    currentItems = items;
  }catch(e){
    currentItems = [];
    errBox.textContent = '解析失败: ' + e.message;
    errBox.style.display = 'block';
  }
  renderList();
  regenerateOutput();
}

function nodeSummary(item){
  if(!item.obj) return null;
  const p = item.obj;
  return `[${p.type}] ${p.name || ''} | ${p.server}:${p.port}`;
}

function renderList(){
  const list = document.getElementById('nodelist');
  const counts = document.getElementById('counts');
  if(currentItems.length === 0){
    list.innerHTML = '<div class="empty">粘贴节点内容后将在此显示</div>';
    counts.textContent = '';
    return;
  }
  const validCount = currentItems.filter(i=>i.obj).length;
  const dupCount = currentItems.filter(i=>i.isDupe).length;
  const invalidCount = currentItems.length - validCount;
  const checkedCount = currentItems.filter(i=>i.checked && i.obj).length;
  counts.textContent = `共 ${currentItems.length} 条 · 有效 ${validCount} · 重复 ${dupCount} · 无效 ${invalidCount} · 已选 ${checkedCount}`;

  list.innerHTML = '';
  currentItems.forEach((item, idx)=>{
    const row = document.createElement('div');
    row.className = 'node-row' + (item.obj ? '' : ' invalid');

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!item.checked && !!item.obj;
    cb.disabled = !item.obj;
    cb.addEventListener('change', ()=>{ item.checked = cb.checked; renderList(); regenerateOutput(); });

    const main = document.createElement('div');
    main.className = 'node-main';

    const title = document.createElement('div');
    title.className = 'node-title';
    if(item.obj){
      const summary = nodeSummary(item);
      title.appendChild(document.createTextNode(summary));
      if(item.isDupe){
        const tag = document.createElement('span');
        tag.className = 'tag dup'; tag.textContent = '重复';
        title.appendChild(tag);
      }
    } else {
      const tag = document.createElement('span');
      tag.className = 'tag bad'; tag.textContent = '无效';
      title.appendChild(tag);
      title.appendChild(document.createTextNode('节点 #' + (idx+1)));
    }
    main.appendChild(title);

    const sub = document.createElement('div');
    sub.className = 'node-sub';
    sub.textContent = item.raw.length > 140 ? item.raw.slice(0,140) + '…' : item.raw;
    main.appendChild(sub);

    if(item.error){
      const errLine = document.createElement('div');
      errLine.className = 'node-err';
      errLine.textContent = '错误: ' + item.error;
      main.appendChild(errLine);
    }
    if(item.warning){
      const warnLine = document.createElement('div');
      warnLine.className = 'node-warn';
      warnLine.textContent = '警告: ' + item.warning;
      main.appendChild(warnLine);
    }

    row.appendChild(cb);
    row.appendChild(main);
    list.appendChild(row);
  });
}

function selectAll(state){
  currentItems.forEach(item => { if(item.obj) item.checked = state; });
  renderList();
  regenerateOutput();
}
function applyDedupe(){
  currentItems.forEach(item => { if(item.obj && item.isDupe) item.checked = false; });
  renderList();
  regenerateOutput();
}
function applyValidOnly(){
  currentItems.forEach(item => { item.checked = !!item.obj; });
  renderList();
  regenerateOutput();
}

function regenerateOutput(){
  const out = document.getElementById('output');
  const meta = document.getElementById('meta');
  const objs = currentItems.filter(i=>i.checked && i.obj).map(i=>i.obj);
  if(objs.length === 0){
    out.value = '';
    meta.textContent = currentItems.length ? '没有已选中的有效节点' : '';
    return;
  }
  try{
    let result;
    if(outFmt === 'block') result = objsToYamlBlock(objs);
    else if(outFmt === 'flow') result = objsToYamlFlow(objs);
    else if(outFmt === 'json') result = objsToJson(objs);
    else if(outFmt === 'base64') result = objsToBase64(objs);
    else result = objs.map(p => { try{ return objToUri(p); }catch(e){ return null; } }).filter(Boolean).join('\n');
    out.value = result;
    meta.textContent = objs.map(p => `[${p.type}] ${p.name} | ${p.server}:${p.port}`).join('\n');
  }catch(e){
    out.value = '';
    meta.textContent = '';
    const errBox = document.getElementById('err');
    errBox.textContent = '输出生成失败: ' + e.message;
    errBox.style.display = 'block';
  }
}

document.getElementById('input').addEventListener('input', handleInput);

function copyOut(){
  const out = document.getElementById('output');
  if(!out.value) return;
  const btn = document.getElementById('copyBtn');
  const flash = (label)=>{ const old = btn.textContent; btn.textContent = label; setTimeout(()=>btn.textContent = old, 1200); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(out.value).then(()=>flash('已复制')).catch(()=>{
      out.select(); document.execCommand('copy'); flash('已复制');
    });
  } else {
    out.select();
    document.execCommand('copy');
    flash('已复制');
  }
}
